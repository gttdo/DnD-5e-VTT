<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-indicator
         area, which is what makes env(safe-area-inset-*) return real values.
         No maximum-scale / user-scalable=no: pinch-to-zoom the PAGE stays
         available for accessibility (the canvas opts out via touch-action). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon_gold.png" />
    <title>The Table — An AI-native tabletop for D&D 5e</title>
    <meta name="description" content="Generate maps and monsters from a sentence, and play D&D 5e with your party on a shared, real-time canvas." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
